apiVersion: v1
kind: ConfigMap
metadata:
  name: happier-server-config
data:
  NODE_ENV: production
  PORT: "3005"
  HAPPIER_SERVER_FLAVOR: full
  HAPPIER_DB_PROVIDER: postgres
  HAPPIER_FILES_BACKEND: s3
  HAPPIER_SOCKET_ADAPTER: memory
  SERVER_ROLE: all
  RUN_MIGRATIONS: "0"
  HAPPIER_PUBLIC_SERVER_URL: https://happier.example.com
  HAPPIER_WEBAPP_URL: https://happier.example.com
  METRICS_ENABLED: "true"
  METRICS_PORT: "9090"
